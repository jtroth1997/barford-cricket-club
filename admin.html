<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092d26"><title>Statistics Admin | Barford CC</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/styles.css"></head><body class="admin-page">
<main class="admin-shell"><a class="brand inverse" href="index.html"><span class="brand-mark"><span></span></span><span><b>Barford</b><small>Statistics admin</small></span></a>
<section id="login-panel" class="admin-card login-card"><p class="eyebrow dark"><span></span> Restricted area</p><h1>Admin sign in</h1><p>Only approved club administrators can add or amend scorecards.</p><form id="login-form"><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button class="button primary" type="submit">Sign in securely</button><p id="login-message" class="form-message"></p></form></section>
<section id="admin-panel" class="admin-dashboard" hidden><div class="admin-title"><div><p class="eyebrow light"><span></span> Statistics control room</p><h1>Record a match</h1></div><button id="sign-out" class="button ghost">Sign out</button></div><div class="admin-card"><form id="match-form"><div class="form-grid"><label>Date<input name="date" type="date" required></label><label>Opposition<input name="opposition" required placeholder="e.g. Long Compton"></label><label>Venue<select name="venue"><option>Home</option><option>Away</option><option>Tour</option></select></label><label>Season<input name="season" type="number" min="1981" max="2100" required></label><label>Barford score<input name="teamScore" placeholder="e.g. 184/7" required></label><label>Opposition score<input name="oppositionScore" placeholder="e.g. 181/9" required></label><label>Result<select name="result"><option>Won</option><option>Lost</option><option>Drawn</option><option>Tied</option><option>Abandoned</option></select></label></div><hr><div class="entry-head"><div><h2>Player scorecard</h2><p>Enter raw figures only. Totals, averages, strike rates and economy are calculated automatically.</p></div><button type="button" id="add-player" class="small-button">+ Add player</button></div><div id="player-rows"></div><button class="button primary save-match" type="submit">Save match & update statistics</button><p id="save-message" class="form-message"></p></form></div></section>
</main><template id="player-template"><fieldset class="player-entry"><button type="button" class="remove-player" aria-label="Remove player">×</button><label>Player<input name="player" required></label><div class="score-grid"><label>Runs<input name="runs" type="number" min="0" value="0"></label><label>Balls<input name="balls" type="number" min="0" value="0"></label><label>Out?<select name="out"><option value="1">Yes</option><option value="0">No</option></select></label><label>4s<input name="fours" type="number" min="0" value="0"></label><label>6s<input name="sixes" type="number" min="0" value="0"></label><label>Overs<input name="overs" inputmode="decimal" value="0"></label><label>Maidens<input name="maidens" type="number" min="0" value="0"></label><label>Runs conceded<input name="conceded" type="number" min="0" value="0"></label><label>Wickets<input name="wickets" type="number" min="0" value="0"></label><label>Catches<input name="catches" type="number" min="0" value="0"></label></div></fieldset></template><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/admin.js"></script></body></html>
